<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>console</title>
<link rel="icon" href="/favicon.ico" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0b0d10;
    color: #d4d8dd;
    font-size: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #1c2128;
    background: #11151a;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; color: #e6edf3; }
  header .meta { color: #6e7781; font-size: 11px; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid #1c2128;
    background: #0d1117;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar input {
    flex: 1;
    min-width: 160px;
    padding: 7px 9px;
    background: #0b0d10;
    border: 1px solid #1f252c;
    border-radius: 6px;
    color: #d4d8dd;
    font-family: inherit;
    font-size: 11px;
    outline: none;
  }
  .toolbar input:focus { border-color: #2f81f7; }
  .toolbar button {
    padding: 7px 12px;
    background: #21262d;
    border: 1px solid #2f343b;
    border-radius: 6px;
    color: #d4d8dd;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .toolbar button:hover { background: #2b3138; }
  .toolbar button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .toolbar button.primary:hover { background: #2f81f7; }
  .toolbar button.danger { color: #f85149; border-color: #3d1f1f; background: #2a1717; }
  .toolbar button.danger:hover { background: #3a1d1d; }
  .toolbar label {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #8b949e;
    font-size: 11px;
    cursor: pointer;
    user-select: none;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .log-line {
    display: grid;
    grid-template-columns: 84px 60px 1fr;
    gap: 8px;
    padding: 5px 6px;
    border-bottom: 1px solid #0f1317;
    align-items: start;
    word-break: break-word;
  }
  .log-line:hover { background: #11151a; }
  .log-line .t { color: #6e7781; white-space: nowrap; }
  .log-line .tag {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    text-align: center;
    align-self: start;
  }
  .tag.error { background: #3d1f1f; color: #f85149; }
  .tag.warn  { background: #3d2e0a; color: #d29922; }
  .tag.info  { background: #1f2d3d; color: #79c0ff; }
  .tag.fetch { background: #1f2f1f; color: #56d364; }
  .log-line .msg { color: #d4d8dd; white-space: pre-wrap; }
  .log-line.error .msg { color: #f85149; }
  .log-line.warn .msg  { color: #d29922; }
  .empty { text-align: center; padding: 60px 20px; color: #6e7781; }
  footer {
    padding: 6px 16px;
    border-top: 1px solid #1c2128;
    background: #0d1117;
    color: #6e7781;
    font-size: 11px;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<header>
  <h1>console</h1>
  <span class="meta" id="status">ready</span>
</header>

<div class="toolbar">
  <input id="testKey" placeholder="view key (to test /api/logs)" autocomplete="off" />
  <button class="primary" id="testBtn">test api</button>
  <button id="copyBtn">copy all</button>
  <button class="danger" id="clearBtn">clear</button>
  <label><input type="checkbox" id="followChk" checked /> follow</label>
</div>

<main id="log"></main>

<footer>
  <span id="counts">0 errors · 0 warnings · 0 fetches</span>
  <span>open with <code>?k=VIEW_KEY</code> to auto-test</span>
</footer>

<script src="/console.js"></script>
</body>
</html>
